spring.application.name=bankapp-backend
server.port=${PORT:8080}

# Aiven MySQL - Environment Variables se aayega
spring.datasource.url=jdbc:mysql://${AIVEN_HOST}:${AIVEN_PORT}/bankapp_db?useSSL=true&requireSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${AIVEN_USER}
spring.datasource.password=${AIVEN_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000
app.account.prefix=BANK
app.frontend.url=${FRONTEND_URL:http://localhost:5173}